[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiacore-pytest"
version = "2.0.2"
description = "pytest adapter for the tiacore test impact protocol"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Lucas Coutinho" }]
dependencies = []

[project.scripts]
tiacore-pytest = "tiacore.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tiacore"]
