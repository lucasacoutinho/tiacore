name: Publish package

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@^11.15.0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs
          build-args: --wfail
      - run: npm ci
      # The built 1.x tree is the oracle of the differential tests.
      - run: npm ci && npm run build
        working-directory: .legacy
      - run: npx playwright install --with-deps chromium
      - run: TIA_FRESH=1 npm run release:check
      - run: npm publish
