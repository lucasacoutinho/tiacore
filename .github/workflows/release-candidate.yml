name: Release candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release-candidate.yml"
      - "CHANGELOG.md"
      - "README.md"
      - "SECURITY.md"
      - "docs/**"
      - "package-lock.json"
      - "package.json"
      - "src/**"

permissions:
  contents: read

jobs:
  candidate:
    name: Build without publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm ci
      - run: TIA_FRESH=1 npm run release:check
      - run: mkdir release-candidate
      - run: npm pack --pack-destination release-candidate
      - run: cp release-candidate/usescherie-tiacore-*.tgz test/fixtures/package-install/tiacore.tgz
      - run: npm install --ignore-scripts
        working-directory: test/fixtures/package-install
      - run: npm test
        working-directory: test/fixtures/package-install
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: tiacore-${{ github.sha }}
          path: release-candidate/*.tgz
          retention-days: 7
