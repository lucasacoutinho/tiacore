name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.15.0
          - 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm ci
      - run: npm run check
      - run: npm run check:vcs

  shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 24
      - run: npm ci
      - run: npm run build
      - name: Link this checkout as tiajs
        run: ln -s "$GITHUB_WORKSPACE" node_modules/tiajs
      - name: Run shard
        run: npx vitest run --root test/fixtures/sharded-vitest --shard=${{ matrix.shard }}/2
        env:
          TIA_FRESH: "1"
          TIA_SHARD_GROUP: ${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: tiajs-shard-${{ matrix.shard }}
          path: test/fixtures/sharded-vitest/.tia/fragments

  aggregate:
    needs:
      - shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 24
      - run: npm ci
      - run: npm run build
      - name: Link this checkout as tiajs
        run: ln -s "$GITHUB_WORKSPACE" node_modules/tiajs
      - uses: actions/download-artifact@v4
        with:
          path: test/fixtures/sharded-vitest/.tia-artifacts
          pattern: tiajs-shard-*
      - name: Restore the provider-neutral graph and replay
        run: npx vitest run --root test/fixtures/sharded-vitest
        env:
          TIA_FILESYSTEM_ARTIFACTS: "1"
