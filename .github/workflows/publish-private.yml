name: Publish private package

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@usescherie"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: TIA_FRESH=1 npm run release:check
      - run: npm run publish:private
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TIA_REGISTRY_URL: https://npm.pkg.github.com
