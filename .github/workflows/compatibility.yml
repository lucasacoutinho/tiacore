name: Compatibility

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    name: pytest SDK / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
          - '3.10'
          - '3.12'
          - '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - run: python -B -m unittest discover -s sdks/python/tests -v
      - run: uv build --out-dir sdks/python/dist sdks/python

  vitest:
    name: Vitest ${{ matrix.vitest }} / Vite ${{ matrix.vite }} / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 20.19.0
            vite: 6.4.3
            vitest: 4.1.0
          - node: 22.15.0
            vite: 7.3.6
            vitest: 4.1.10
          - node: 24
            vite: 8.1.5
            vitest: 4.1.10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm pack --pack-destination test/fixtures/package-install
      - run: mv test/fixtures/package-install/usescherie-tiacore-*.tgz test/fixtures/package-install/tiacore.tgz
      - run: npm pkg set "devDependencies.vite=${{ matrix.vite }}" "devDependencies.vitest=${{ matrix.vitest }}"
        working-directory: test/fixtures/package-install
      - run: npm install --ignore-scripts
        working-directory: test/fixtures/package-install
      - run: npm test
        working-directory: test/fixtures/package-install

  node-test:
    name: node:test / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.10.0
          - 22.15.0
          - 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: npm install --ignore-scripts
        working-directory: test/fixtures/node-runner
      - run: npm run certify
        working-directory: test/fixtures/node-runner

  bun-test:
    name: bun:test / Bun ${{ matrix.bun }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - bun: '1.3.0'
            os: ubuntu-latest
          - bun: '1.3.14'
            os: ubuntu-latest
          - bun: '1.3.14'
            os: windows-latest
          - bun: '1.3.14'
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: npm ci
      - run: npm run build
      - run: bun install --ignore-scripts
        working-directory: test/fixtures/bun-runner
      - run: bun run certify
        working-directory: test/fixtures/bun-runner

  playwright:
    name: Playwright and Vitest Browser Mode / Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx vitest run test/integration/vitest/playwright.integration.test.ts
      - run: >-
          npx vitest run test/integration/vitest/fixture.integration.test.ts -t "selects one Browser Mode case"

  package-manager:
    name: Install with ${{ matrix.manager }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manager:
          - npm
          - pnpm
          - yarn
          - bun
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm ci
      - run: npm pack --pack-destination test/fixtures/package-install
      - run: mv test/fixtures/package-install/usescherie-tiacore-*.tgz test/fixtures/package-install/tiacore.tgz
      - if: matrix.manager == 'npm'
        run: npm install --ignore-scripts
        working-directory: test/fixtures/package-install
      - if: matrix.manager == 'npm'
        run: npm test
        working-directory: test/fixtures/package-install
      - if: matrix.manager == 'pnpm'
        run: npx --yes pnpm@11.18.0 install --ignore-scripts
        working-directory: test/fixtures/package-install
      - if: matrix.manager == 'pnpm'
        run: npx --yes pnpm@11.18.0 test
        working-directory: test/fixtures/package-install
      - if: matrix.manager == 'yarn'
        run: npx --yes @yarnpkg/cli-dist@4.18.0 install
        working-directory: test/fixtures/package-install
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
      - if: matrix.manager == 'yarn'
        run: npx --yes @yarnpkg/cli-dist@4.18.0 test
        working-directory: test/fixtures/package-install
      - if: matrix.manager == 'bun'
        run: bun install --ignore-scripts
        working-directory: test/fixtures/package-install
      - if: matrix.manager == 'bun'
        run: bun run test
        working-directory: test/fixtures/package-install
