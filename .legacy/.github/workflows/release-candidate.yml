name: Release candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'capabilities/**'
      - 'CHANGELOG.md'
      - 'config/**'
      - 'conformance/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'README.md'
      - 'schemas/**'
      - 'SECURITY.md'
      - 'docs/**'
      - 'package-lock.json'
      - 'package.json'
      - 'sdks/**'
      - 'spec/**'
      - 'src/**'
      - 'test/**'
      - 'tsconfig*.json'
      - 'vitest*.ts'

permissions:
  contents: read

jobs:
  candidate:
    name: Build without publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 24
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: TIA_FRESH=1 npm run release:check
      - run: mkdir release-candidate
      - run: npm pack --pack-destination release-candidate
      - run: cp sdks/python/dist/* release-candidate/
      - run: cp release-candidate/lucasacoutinho-tiacore-*.tgz test/fixtures/package-install/tiacore.tgz
      - run: npm install --ignore-scripts
        working-directory: test/fixtures/package-install
      - run: npm test
        working-directory: test/fixtures/package-install
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: tiacore-${{ github.sha }}
          path: release-candidate/*
          retention-days: 7
