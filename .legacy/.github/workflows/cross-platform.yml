name: Cross-platform paths

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  paths:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 24
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
      - run: npm ci
      - run: npm run test:cross-platform
      - run: npm run check:go
